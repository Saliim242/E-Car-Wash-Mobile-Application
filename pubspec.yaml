name: ewash
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.2
  get: 4.6.6
  flutter:
    sdk: flutter
  intl: ^0.19.0
  money_formatter: ^0.0.6
  iconsax: ^0.0.8
  iconly: ^1.0.1
  get_storage: ^2.1.1
  animate_do: ^3.3.4
  smooth_page_indicator: ^1.2.0+3
  fluttertoast: ^8.2.5
  http: ^1.1.0
  gap: ^3.0.1
  loading_animation_widget: ^1.2.1
  modal_progress_hud_nsn: ^0.5.1
  line_icons: ^2.0.3
  auto_size_text: ^3.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  page_transition: ^2.1.0
  card_swiper: ^3.0.1
  like_button: ^2.0.5
  lottie: ^2.7.0
  intl_phone_number_input: ^0.7.3+1
  image_cropper: ^8.0.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  after_layout: ^1.2.0

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/animations/
    # - assets/fonts/
    - assets/images/
    # - assets/icons/
    - assets/onboarding/
    - assets/icons/
  fonts:
    - family: Metrophobic
      fonts:
        - asset: assets/fonts/Metrophobic-Regular.ttf
